      var today = i === todayIdx;
      var label = '';
      if (scale === 'week') { label = String(d.getDate()); }
      else if (dow === 1) { label = String(d.getDate()); }
      days.push({
        w: dayW,
        label: label,
        bg: weekend ? '#f5f5f5' : 'transparent',
        pillBg: today ? accent : 'transparent',
        fg: today ? '#fafafa' : (weekend ? '#a3a3a3' : '#737373')
      });
    }

    var bands = [];
    for (var j = 0; j < dayCount; j += 1) {
      var dd = new Date(origin.getTime() + j * 86400000);
      if (dd.getDay() === 6) { bands.push({ left: j * dayW, w: Math.min(2 * dayW, chartW - j * dayW) }); }
    }

    var weeks = [];
    for (var k = 0; k < dayCount; k += 7) {
      var ws = new Date(origin.getTime() + k * 86400000);
      var we = new Date(origin.getTime() + (k + 6) * 86400000);
      weeks.push({
        w: 7 * dayW,
        label: (ws.getMonth() + 1) + '월 ' + ws.getDate() + '일 – ' + (we.getMonth() + 1) + '월 ' + we.getDate() + '일'
      });
    }

    var all = this.data();
    var byId = {};
    var kids = {};
    all.forEach(function (t) {
      byId[t.id] = t;
      if (t.parent) { kids[t.parent] = (kids[t.parent] || 0) + 1; }
    });

    var hidden = function (t) {
      var p = t.parent;
      while (p) { if (closed[p]) { return true; } p = byId[p] ? byId[p].parent : null; }
      return false;
    };

    var visible = all.filter(function (t) {
      if (q !== '' && t.title.indexOf(q) < 0) { return false; }
      if (ow && t.owner !== ow) { return false; }
      if (q === '' && !ow) { return !hidden(t); }
      return true;
    });

    var rows = visible.map(function (t) {
      var bd = self.badge(t.st, accent);
      var isGroup = !!kids[t.id] && q === '' && !ow;
      var hasBar = t.s >= 0;
      var left = t.s * dayW;
      var w = Math.max(dayW - 4, (t.e - t.s + 1) * dayW - 4);
      if (left + w > chartW) { w = Math.max(0, chartW - left); }
      var barBg = '#e5e5e5';
      var fillBg = '#171717';
      if (kids[t.id]) { barBg = '#e5e5e5'; fillBg = '#a3a3a3'; }
      else if (t.st === 'done') { barBg = '#171717'; fillBg = '#171717'; }
      else if (t.st === 'todo') { barBg = '#f5f5f5'; fillBg = '#f5f5f5'; }
      return {
        key: t.key,
        title: t.title,
        group: isGroup,
        leaf: !isGroup,
        caret: closed[t.id] ? 0 : 90,
        indent: (q === '' && !ow) ? t.lv * 20 : 0,
        weight: kids[t.id] ? '600' : '400',
        badge: bd.label, badgeBg: bd.bg, badgeFg: bd.fg,
        av: t.owner ? t.owner.charAt(0) : '–',
        avBg: t.owner ? '#f5f5f5' : '#ffffff',
        avFg: t.owner ? '#0a0a0a' : '#a3a3a3',
        rowBg: picked === t.id ? '#fafafa' : '#ffffff',
        hasBar: hasBar,
        undated: !hasBar,
        barLeft: left,
        barW: w,
        barTop: kids[t.id] ? 16 : 8,
        barH: kids[t.id] ? 8 : 24,
        barR: kids[t.id] ? 9999 : 6,
        barBg: barBg,
        fillBg: fillBg,
        fillPct: t.p,
        toggle: function (e) {
          if (e && e.stopPropagation) { e.stopPropagation(); }
          var next = {};
          Object.keys(closed).forEach(function (kk) { next[kk] = closed[kk]; });
          next[t.id] = !next[t.id];
          self.setState({ closed: next });
        },
        select: function () { self.setState({ picked: t.id }); }
      };
    });

    var owners = ['김서연', '박지훈', '이도현', '정하늘'];
    var ownerChips = owners.map(function (n) {
      var on = ow === n;
      return {
        ch: n.charAt(0),
        bg: on ? '#171717' : '#ffffff',
        bc: on ? '#171717' : '#e5e5e5',
        fg: on ? '#fafafa' : '#0a0a0a',
        pick: function () { self.setState({ ow: on ? null : n }); }
      };
    });

    var scales = [
      { key: 'week', label: '주' },
      { key: 'month', label: '개월' }
    ].map(function (sc) {
      var on = scale === sc.key;
      return {
        label: sc.label,
        bg: on ? '#ffffff' : 'transparent',
        fg: on ? '#0a0a0a' : '#737373',
        weight: on ? '600' : '400',
        pick: function () { self.setState({ scale: sc.key }); }
      };
    });

    var last = new Date(origin.getTime() + (dayCount - 1) * 86400000);
    return {
      accent: accent,
      dayW: dayW,
      days: days,
      bands: bands,
      weeks: weeks,
      todayX: todayIdx * dayW + Math.round(dayW / 2),
      rows: rows,
      noRows: rows.length === 0,
      q: q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      ownerChips: ownerChips,
      scales: scales,
      rangeLabel: '2026년 9월 7일 – ' + (last.getMonth() + 1) + '월 ' + last.getDate() + '일'
    };
  }
}
</script>
