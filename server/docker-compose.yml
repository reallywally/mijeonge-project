services:
  db:
    image: postgres:17
    container_name: innoflow-db
    environment:
      POSTGRES_DB: innoflow
      POSTGRES_USER: innoflow
      POSTGRES_PASSWORD: innoflow
    ports:
      - "5432:5432"
    volumes:
      - innoflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innoflow -d innoflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  innoflow-pgdata:
